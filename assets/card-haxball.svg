  <text x="24" y="98" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#CFE8F5" >Agente de Haxball com rede neural treinada por</text>
  <text x="24" y="119" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#CFE8F5" >algoritmo genético e por aprendizado</text>
